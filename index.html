*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--font-body);margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
.app{max-width:520px;margin:0 auto;padding-bottom:calc(92px + env(safe-area-inset-bottom,0px))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3,p{margin:0}
.num{font-variant-numeric:tabular-nums}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 0 10px}
.brand{display:flex;align-items:center;gap:10px;font:700 25px/1 var(--font-display);letter-spacing:-.01em}
.mark{display:grid;place-items:center;width:32px;height:32px;border-radius:10px;background:var(--hero);color:#fff;font:700 22px/1 var(--font-display);padding-bottom:2px}
.yr{display:flex;align-items:center;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:2px}
.yr button{width:40px;height:40px;border:0;background:none;border-radius:50%;font-size:22px;line-height:1;color:var(--muted)}
.yr button:disabled{opacity:.3;cursor:default}
.yr span{min-width:52px;text-align:center;font:700 16px var(--font-display);font-variant-numeric:tabular-nums}

/* notes + banners */
.note{border-radius:14px;padding:12px 14px;font-size:14px;line-height:1.4;display:flex;gap:12px;align-items:center;justify-content:space-between;margin:0 0 12px}
.note.sample{background:var(--accent-soft);color:var(--ink)}
.note.warn{background:var(--warn-soft);color:var(--ink)}
.note.plain{background:var(--surface2);color:var(--muted);display:block;border:1px solid var(--line)}
.note button{flex:none}
.linkbtn{background:none;border:0;padding:8px 4px;color:var(--accent);font-weight:700;text-decoration:underline;text-underline-offset:3px;min-height:40px}

/* cards */
.card{background:var(--surface);border-radius:22px;box-shadow:var(--shadow);padding:20px;margin:0 0 14px}
.card h2,.sec-title{font:700 13px/1.2 var(--font-body);color:var(--muted);letter-spacing:.01em}
.hero-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.pill{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 14px;border-radius:999px;background:var(--accent-soft);color:var(--accent);border:0;font-weight:700;font-size:14px}
.hero-num{display:block;font:700 clamp(48px,15.5vw,68px)/1 var(--font-display);letter-spacing:-.02em;color:var(--accent);margin:10px 0 6px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.hero-num .cur{font-size:.55em;vertical-align:.5em;margin-right:2px;font-weight:700}
.hero-num .dec{font-size:.42em;font-weight:700;opacity:.8;letter-spacing:0}
.hero-sub{color:var(--muted);font-size:14px}
.card.hero{background:var(--hero);color:var(--hero-ink);box-shadow:0 10px 30px rgba(15,37,71,.28)}
.card.hero h2{color:var(--hero-muted)}
.hero .hero-num{color:var(--hero-ink)}
.hero .hero-sub,.hero .bar-cap,.hero .lg .lt{color:var(--hero-muted)}
.hero .pill{background:var(--hero-pill);color:var(--hero-ink)}
.hero .keep-row{border-top-color:var(--hero-line)}
.hero .keep-row .val{color:var(--hero-keep)}
.hero .keep-row .val.neg{color:#FF9AA2}
.hero .seg-cost{background:var(--hero-cost)} .hero .seg-sa{background:var(--hero-sa)} .hero .seg-keep{background:var(--hero-keepbar)}
.hero .lg .lv{color:var(--hero-ink)}
.keep-row{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:16px 0 18px;padding-top:14px;border-top:1px solid var(--line)}
.keep-row .lbl{font-weight:700}
.keep-row .val{font:700 28px/1 var(--font-display);color:var(--keep);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.keep-row .val.neg{color:var(--bad)}
.bar-cap{font-size:13px;color:var(--muted);margin-bottom:8px}
.bar{display:flex;gap:3px;height:22px;border-radius:11px;overflow:hidden}
.bar.grow{animation:grow .9s cubic-bezier(.2,.7,.2,1) both}
@keyframes grow{from{clip-path:inset(0 100% 0 0 round 11px)}to{clip-path:inset(0 0 0 0 round 11px)}}
.bar i{display:block;min-width:0;border-radius:4px}
.bar i:first-child{border-radius:11px 4px 4px 11px}
.bar i:last-child{border-radius:4px 11px 11px 4px}
.bar i:only-child{border-radius:11px}
.seg-cost{background:var(--cost)} .seg-sa{background:var(--accent)} .seg-keep{background:var(--keep)}
.legend{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}
.lg{min-width:0}
.lg .lt{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.lg .dot{width:10px;height:10px;border-radius:50%;flex:none}
.lg .lv{font:700 19px var(--font-display);margin-top:2px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 20px;border-radius:16px;border:0;font-weight:700;font-size:16px;background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.primary{background:var(--accent);color:var(--accent-ink);box-shadow:none}
.btn.danger{color:var(--bad);box-shadow:inset 0 0 0 1.5px var(--bad)}
.btn.block{width:100%}
.btn.small{min-height:44px;padding:0 16px;font-size:15px}
.btn svg{flex:none}
.quick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:0 0 14px}
.quick .btn{padding:10px 8px;flex-direction:column;gap:6px;min-height:84px;font-size:14px;border-radius:18px;box-shadow:var(--shadow)}
.quick .ic{display:grid;place-items:center;width:38px;height:38px;border-radius:50%}
.quick .ic.i1{background:var(--keep-soft);color:var(--keep)}
.quick .ic.i2{background:var(--accent-soft);color:var(--accent)}
.quick .ic.i3{background:var(--warn-soft);color:var(--warn)}

/* next payment */
.next-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.next-amt{font:700 38px/1.05 var(--font-display);letter-spacing:-.015em;margin:8px 0 2px;font-variant-numeric:tabular-nums}
.next-meta{color:var(--muted);font-size:14px}
.days{flex:none;text-align:center;background:var(--surface2);border:1px solid var(--line);border-radius:16px;padding:8px 12px;min-width:74px}
.days b{display:block;font:700 28px/1 var(--font-display);font-variant-numeric:tabular-nums}
.days small{font-size:12px;color:var(--muted)}
.days.soon{background:var(--warn-soft);border-color:transparent}
.days.soon b{color:var(--warn)}
.card .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;align-items:center}
.tiny{font-size:13px;color:var(--muted);margin-top:10px}
.tiny a{color:var(--accent);font-weight:600}

/* quarter rows */
.qrows{list-style:none;margin:10px 0 0;padding:0}
.q{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:12px 0;border-top:1px solid var(--line);align-items:center}
.q:first-child{border-top:0}
.q .qt{font-weight:700}
.q .qs{font-size:13px;color:var(--muted)}
.q .qa{font:700 18px var(--font-display);text-align:right;font-variant-numeric:tabular-nums}
.chip{display:inline-block;font-size:12px;font-weight:700;border-radius:999px;padding:3px 10px;white-space:nowrap}
.chip.paid{background:var(--keep-soft);color:var(--keep)}
.chip.next{background:var(--accent-soft);color:var(--accent)}
.chip.behind{background:var(--warn-soft);color:var(--warn)}
.chip.up{background:var(--surface2);color:var(--muted);box-shadow:inset 0 0 0 1px var(--line)}
.q .qr{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:4px}

/* lists */
.summary{margin:4px 0 14px}
.summary .big{font:700 44px/1.05 var(--font-display);letter-spacing:-.015em;font-variant-numeric:tabular-nums;margin-top:4px}
.summary .sub{color:var(--muted);font-size:14px;margin-top:2px}
.sum-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.month{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:20px 2px 6px;font:700 14px var(--font-body);color:var(--muted)}
.month b{font-variant-numeric:tabular-nums;color:var(--ink)}
.rows{list-style:none;margin:0;padding:0;background:var(--surface);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}
.rows li+li{border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;align-items:center;width:100%;text-align:left;background:none;border:0;padding:13px 16px;min-height:60px}
.row .r1{font-weight:650;overflow-wrap:anywhere}
.row .r2{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.row .ra{font:700 18px var(--font-display);font-variant-numeric:tabular-nums;text-align:right}
.row .rb{font-size:12px;color:var(--muted);text-align:right}
.row.income .ra{color:var(--keep)}
.empty{background:var(--surface);border-radius:22px;padding:28px 22px;text-align:center;box-shadow:var(--shadow)}
.empty h3{font:700 24px/1.15 var(--font-display);margin-bottom:6px}
.empty p{color:var(--muted);margin-bottom:16px}
.cats{display:grid;gap:10px;margin:0 0 6px;padding:16px;background:var(--surface);border-radius:18px;box-shadow:var(--shadow)}
.cat{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;font-size:14px}
.cat .cb{grid-column:1/-1;height:8px;background:var(--surface2);border-radius:4px;overflow:hidden}
.cat .cb i{display:block;height:100%;background:var(--accent);border-radius:4px}
.cdot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:1px}
.cat span:last-child{font-weight:700;font-variant-numeric:tabular-nums}

/* more */
.sec{margin:22px 0 8px}
.set{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}
.set>*+*{border-top:1px solid var(--line)}
.set .row{min-height:56px}
.set-p{padding:14px 16px}
.set-p p{color:var(--muted);font-size:14px}
.stack{display:grid;gap:10px}
.btnrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.about{font-size:13px;color:var(--muted);margin-top:22px;line-height:1.5}

/* tab bar */
.tabs{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(100%,520px);display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
.tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;min-height:56px;border:0;background:none;color:var(--muted);font-size:12px;font-weight:650;border-radius:14px}
.tabs button[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}

/* sheet */
.sheet-root{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet-root[hidden]{display:none}
.scrim{position:absolute;inset:0;background:var(--scrim)}
.sheet{position:relative;width:min(100%,520px);max-height:92%;overflow:auto;background:var(--surface);border-radius:24px 24px 0 0;padding:8px 20px calc(24px + env(safe-area-inset-bottom,0px));box-shadow:0 -10px 40px rgba(0,0,0,.25);animation:up .22s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:.5}to{transform:none;opacity:1}}
.sheet-h{display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:var(--surface);padding:12px 0 8px;z-index:1}
.sheet-h h2{font:700 24px var(--font-display);color:var(--ink)}
.x{width:44px;height:44px;border-radius:50%;border:0;background:var(--surface2);font-size:24px;line-height:1;color:var(--muted)}
.fld{display:grid;gap:6px;margin:0 0 14px}
.fld label,.fld .l{font-size:14px;font-weight:650}
.fld .hint{font-size:13px;color:var(--muted)}
.inp{width:100%;min-height:50px;padding:0 14px;border:1.5px solid var(--line);background:var(--surface2);border-radius:14px;font-size:17px}
.inp:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.money{position:relative}
.money span{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:17px}
.money .inp{padding-left:30px;font:700 26px var(--font-display)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.chk{display:flex;align-items:center;gap:12px;min-height:48px;font-weight:600;margin:0 0 12px}
.chk input{width:24px;height:24px;accent-color:var(--accent)}
.err{color:var(--bad);font-size:14px;min-height:20px;margin:-4px 0 8px}
.calc{background:var(--surface2);border-radius:14px;padding:12px 14px;margin:0 0 14px;font-size:14px;color:var(--muted)}
.calc b{color:var(--ink);font-variant-numeric:tabular-nums}
.stepper{display:grid;grid-template-columns:56px 1fr 56px;gap:12px;align-items:center;margin:8px 0 14px}
.stepper button{height:56px;border-radius:16px;border:0;background:var(--surface2);font-size:28px;font-weight:700;box-shadow:inset 0 0 0 1.5px var(--line)}
.stepper output{text-align:center;font:700 52px var(--font-display);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--accent);height:36px}
.presets{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 14px}
.presets button{min-height:44px;padding:0 16px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-weight:700}
.presets button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.sheet textarea.inp{min-height:180px;padding:12px 14px;font:16px/1.4 ui-monospace,Menlo,Consolas,monospace}
.sheet .btnrow{margin-top:6px}

/* chart */
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .cap{display:flex;justify-content:space-between;align-items:baseline;gap:10px;min-height:44px;margin-top:8px;font-size:14px;color:var(--muted)}
.chart .cap b{font:700 22px var(--font-display);color:var(--ink);font-variant-numeric:tabular-nums}
.chart .bars rect{cursor:pointer}
.chart .bars .hit{fill:transparent}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .axis{fill:var(--muted);font:11px var(--font-body)}
.chart .axis.m{font-size:11px}
.chart .bar-on{fill:var(--c1)}
.chart .bar-sel{fill:var(--ink)}
/* toast */
.toast{width:max-content;position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:30;background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:14px;display:flex;gap:14px;align-items:center;font-weight:600;max-width:calc(100% - 32px);box-shadow:var(--shadow)}
.toast[hidden]{display:none}
.toast button{background:none;border:0;color:var(--bg);font-weight:800;padding:6px 4px;min-height:36px;text-decoration:underline;text-underline-offset:3px}
@media (prefers-reduced-motion:reduce){.sheet,.bar.grow{animation:none}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ===== v2: jars, ring, planner, rewards ===== */
:root{--amber:#B96A0B;--ring1:#6A83A8;--ring2:#1F5BD8;--ring3:#0B7F59;--bar2:#A9C4F2;--hero2:#16305C}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--amber:#F0A75B;--ring1:#5F7BA2;--ring2:#3F7CF2;--ring3:#3DD6A0;--rpctk:#05281D;--bar2:#3A5C94}}
:root[data-theme="dark"]{--amber:#F0A75B;--ring1:#5F7BA2;--ring2:#3F7CF2;--ring3:#3DD6A0;--rpctk:#05281D;--bar2:#3A5C94}
[hidden]{display:none!important}
.num{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* jar tabs */
.jbar{display:flex;gap:8px;overflow-x:auto;margin:0 -16px 14px;padding:2px 16px 8px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.jbar::-webkit-scrollbar{display:none}
.jt{flex:none;display:flex;align-items:center;gap:8px;min-height:44px;padding:0 15px;border-radius:22px;background:var(--surface);border:1px solid var(--line);font-weight:700;font-size:16px;color:var(--ink);white-space:nowrap;transition:transform .15s}
.jt:active{transform:scale(.97)}
.jt .d{width:10px;height:10px;border-radius:50%;flex:none}
.jt small{font-weight:600;font-size:13px;color:var(--muted)}
.jt.on{background:var(--hero);color:#fff;border-color:var(--hero);box-shadow:0 6px 16px rgba(15,37,71,.3)}
.jt.on small{color:rgba(255,255,255,.75)}
.jt.add{border:1.5px dashed var(--muted);background:transparent;color:var(--muted)}

/* hero (the big jar card) */
.card.hero{background:linear-gradient(160deg,#16305C 0%,#0F2547 60%);color:#fff;padding:20px 20px 18px;box-shadow:0 14px 34px rgba(15,37,71,.32);transition:background .6s}
.card.hero.covered{background:linear-gradient(160deg,#0E7A58,#0B5C43);box-shadow:0 14px 34px rgba(11,92,67,.34)}
.card.hero.behind{background:linear-gradient(160deg,#B96A0B,#8E4E06);box-shadow:0 14px 34px rgba(142,78,6,.34)}
.card.hero h2{color:rgba(255,255,255,.78);font-size:13px;letter-spacing:.04em;text-transform:uppercase}
.htop{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.htop h2{margin:0}
.today{font-size:13px;font-weight:700;color:rgba(255,255,255,.82)}
.hrow{display:flex;gap:14px;align-items:center;margin-top:10px}
.jarwrap{flex:none;width:112px;text-align:center}
.jarcap{font-size:12px;line-height:1.2;margin-top:4px;color:rgba(255,255,255,.78)}
.hmain{min-width:0;flex:1}
.hrow .hero-num{font-size:clamp(34px,10.8vw,50px);margin:0;line-height:1}
.hlab{font-size:16px;color:#fff;margin:6px 0 10px;line-height:1.25}
.hero .pill{min-height:34px;padding:0 12px;font-size:14px;background:rgba(255,255,255,.16);color:#fff}
.hnote{margin-top:12px;background:rgba(0,0,0,.18);border-radius:14px;padding:10px 12px;font-size:14.5px;line-height:1.3}
.hbtns{display:flex;gap:10px;margin-top:16px}
.hbtns .btn{flex:1 1 0;min-height:50px;padding:0 8px;font-size:15.5px;box-shadow:none;white-space:nowrap}
.btn.w{background:#fff;color:#0F2547}
.btn.g{background:rgba(255,255,255,.16);color:#fff}
.jhero .btn.g{color:#fff}
.stats{display:flex;margin-top:16px;border-top:1px solid rgba(255,255,255,.18);padding-top:14px}
.stats>*{flex:1;min-width:0;text-align:left;background:none;border:0;color:inherit;padding:0}
.stats>*+*{border-left:1px solid rgba(255,255,255,.18);padding-left:14px}
.stat b{display:block;font:700 22px/1.1 var(--font-display);font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:rgba(255,255,255,.78);display:block;margin-top:2px}
button.stat{cursor:pointer}
.jarwrap svg{display:block;margin:0 auto;overflow:visible}
.liq{transition:transform 1.25s cubic-bezier(.3,.75,.2,1)}
.wv{animation:wave 3.4s linear infinite}
.wv2{animation:wave 5.2s linear infinite reverse}
@keyframes wave{from{transform:translateX(0)}to{transform:translateX(-60px)}}

/* mile bar in goal jars */
.mile{display:flex;gap:6px;margin-top:16px}
.mile i{flex:1;height:8px;border-radius:4px;display:block}
.mnote{margin-top:10px;font-size:15px}
.mnote b{color:#fff}
.jdate{display:flex;gap:14px;align-items:center}
.jdate .ico{flex:none;width:44px;height:44px;border-radius:14px;display:grid;place-items:center}
.jdate b{font-size:16px}
.jdate .sub{color:var(--muted);font-size:14px;margin-top:2px}

/* ring card */
.card .sub{color:var(--muted);font-size:14.5px;margin-top:4px}
.ring{display:block;width:100%;max-width:300px;height:auto;margin:10px auto 0;overflow:visible}
.rseg{transition:stroke-dasharray 1.1s cubic-bezier(.3,.75,.2,1)}
.rpct{font:700 15px var(--font-body);fill:#fff}
.rpct.k{fill:var(--rpctk,#fff)}
.rnum{font:700 30px var(--font-display);fill:var(--ink)}
.rlab{font:13px var(--font-body);fill:var(--muted)}
.rleg{display:flex;flex-wrap:wrap;gap:8px 16px;justify-content:center;margin-top:12px;font-size:14px;font-weight:700}
.rleg span{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.rleg i{display:block;width:12px;height:12px;border-radius:50%;flex:none}
.say{background:var(--accent-soft);color:var(--ink);border-radius:16px;padding:12px 14px;font-size:15.5px;margin-top:12px;line-height:1.4}
.say.plain{background:var(--surface2);color:var(--muted);font-size:14.5px}
.leg{margin-top:8px}
.lr{display:flex;gap:12px;padding:11px 0;border-top:1px solid var(--line);align-items:flex-start}
.lr:first-child{border-top:0}
.lr .d{flex:none;width:14px;height:14px;border-radius:50%;margin-top:5px}
.lr .d.ring0{background:var(--surface2);box-shadow:inset 0 0 0 2px var(--line)}
.lr .t{flex:1;min-width:0;font-size:15.5px;line-height:1.3}
.lr .t b{display:block;font-size:16.5px}
.lr .t span{color:var(--muted)}
.lr .v{font:700 19px var(--font-display);font-variant-numeric:tabular-nums;white-space:nowrap}
.inl{background:none;border:0;padding:0;color:var(--accent);font-weight:700;text-decoration:underline;text-underline-offset:3px;font-size:inherit}

/* section headings */
.sec-h{margin:24px 2px 10px}
.sec-t{font:700 22px/1.15 var(--font-display);color:var(--ink)}
.sec-h p{color:var(--muted);font-size:15px;margin-top:3px}
.card.pad0{padding:4px 20px 16px}

/* chart tweaks */
.chart h2{font-size:13px}
.chart .b{transition:opacity .2s}
.chart svg.anim .b{transform-box:fill-box;transform-origin:50% 100%;animation:grow2 .7s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i)*35ms)}
@keyframes grow2{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.chart .hit{fill:transparent;cursor:pointer}

/* timeline */
.tl{display:flex;list-style:none;margin:14px 0 0;padding:0}
.tn{flex:1;text-align:center;position:relative;min-width:0}
.tn:not(:last-child)::after{content:"";position:absolute;top:15px;left:calc(50% + 18px);right:calc(-50% + 18px);height:3px;border-radius:2px;background:var(--line)}
.tn.done:not(:last-child)::after{background:var(--keep)}
.tn .dot{width:32px;height:32px;margin:0 auto;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:2.5px solid var(--line);color:#fff;font-weight:800;position:relative;z-index:1}
.tn.done .dot{background:var(--keep);border-color:var(--keep)}
.tn.late .dot{background:#D98E2A;border-color:#D98E2A}
.tn.behind .dot{border-color:var(--amber);color:var(--amber);background:var(--warn-soft)}
.tn.next .dot{border-color:var(--accent);box-shadow:0 0 0 6px var(--accent-soft)}
.tn.next .dot::after{content:"";width:12px;height:12px;border-radius:50%;background:var(--accent)}
.tn b{display:block;margin-top:8px;font-size:15px}
.tn span{font-size:12.5px;color:var(--muted);line-height:1.2;display:block;padding:0 2px}
.tn.next span{color:var(--accent);font-weight:700}
.tn.behind span{color:var(--amber);font-weight:700}
.streak{display:inline-flex;align-items:center;gap:6px;margin-top:14px;background:var(--warn-soft);color:var(--warn);border-radius:999px;padding:6px 12px;font-weight:700;font-size:14px}

/* how to pay */
.how{display:flex;gap:12px;align-items:center;padding:13px 0;border-top:1px solid var(--line)}
.how:first-child{border-top:0}
.how .ic{flex:none;width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.how .ic.warn{background:var(--warn-soft);color:var(--warn)}
.how .t{flex:1;min-width:0;line-height:1.25}
.how .t b{font-size:16.5px;display:block}
.how .t>span{font-size:14.5px;color:var(--muted)}
.tag{display:inline-block;font-size:11.5px;font-weight:800;padding:2px 8px;border-radius:999px;background:var(--keep-soft);color:var(--keep);margin-left:6px;vertical-align:2px;letter-spacing:.02em}
.how .t b .tag{display:inline-block;color:var(--keep);font-size:11.5px}
.how .t b .tag.f{color:var(--warn)}
.tag.f{background:var(--warn-soft);color:var(--warn)}
.go{flex:none;font-weight:700;font-size:15px;color:var(--accent);display:flex;align-items:center;gap:3px;text-decoration:none;min-height:44px}
.tip{background:var(--warn-soft);border-radius:16px;padding:12px 14px;font-size:15px;color:var(--ink);margin-top:8px;line-height:1.4}

/* banners and notes */
.banner{border-radius:22px;padding:16px;display:flex;gap:14px;align-items:center;color:#fff;background:linear-gradient(135deg,#0B9E6B,#0B7F59);box-shadow:0 10px 26px rgba(11,127,89,.35);margin:0 0 14px}
.banner .bic{flex:none;width:54px;height:54px;border-radius:18px;background:rgba(255,255,255,.2);display:grid;place-items:center}
.banner b{font:700 21px/1.15 var(--font-display);display:block}
.banner span{font-size:15px;opacity:.95;line-height:1.25;display:block;margin-top:3px}

<script>
(function(){
"use strict";
var BUILD_DEMO=true;var BUILD_PWA=true;var BUILD_GATE=false;var BUILD_CODES=[];var BUILD_BUY="";
const IS_DEMO=typeof BUILD_DEMO==="boolean"?BUILD_DEMO:false;
const PWA_BUILD=typeof BUILD_PWA==="boolean"?BUILD_PWA:false;
const GATE=typeof BUILD_GATE==="boolean"?BUILD_GATE:false;
const CODES=typeof BUILD_CODES!=="undefined"&&Array.isArray(BUILD_CODES)?BUILD_CODES:[];
const BUY_URL=typeof BUILD_BUY==="string"?BUILD_BUY:"";
const REDUCED=!!(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches);
const DEMO_JARS=3;

/* ---------- helpers ---------- */
const $=(s,r)=>(r||document).querySelector(s);
const $$=(s,r)=>Array.from((r||document).querySelectorAll(s));
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const MONTHS=["January","February","March","April","May","June","July","August","September","October","November","December"];
const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const DOW=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const pad=n=>n<10?"0"+n:""+n;
const iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parseISO=s=>{const p=s.split("-");return new Date(+p[0],+p[1]-1,+p[2])};
const todayStr=()=>iso(new Date());
const uid=()=>Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-4);
const fmtDate=(s,withYear)=>{const d=parseISO(s);return MON[d.getMonth()]+" "+d.getDate()+(withYear?", "+d.getFullYear():"")};
const fmtLong=s=>{const d=parseISO(s);return DOW[d.getDay()]+", "+MON[d.getMonth()]+" "+d.getDate()+", "+d.getFullYear()};
const daysBetween=(a,b)=>Math.round((parseISO(b)-parseISO(a))/86400000);
const addDays=(s,n)=>{const d=parseISO(s);d.setDate(d.getDate()+n);return iso(d)};
const money=c=>{const neg=c<0;c=Math.abs(c);return (neg?"−":"")+"$"+(c/100).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2})};
const money0=c=>{const neg=c<0;c=Math.abs(Math.round(c/100));return (neg?"−":"")+"$"+c.toLocaleString("en-US")};
const bigMoney=c=>{const neg=c<0;c=Math.abs(Math.round(c));const w=Math.floor(c/100),r=c%100;return (neg?"−":"")+'<span class="cur">$</span>'+w.toLocaleString("en-US")+'<span class="dec">.'+pad(r)+'</span>'};
const miFmt=n=>n.toLocaleString("en-US",{maximumFractionDigits:1});
const parseMoney=s=>{const t=String(s||"").replace(/[$,\s]/g,"");if(!/^\d*\.?\d{0,2}$/.test(t)||t===""||t===".")return NaN;return Math.round(parseFloat(t)*100)};
const parseNum=s=>{const t=String(s||"").replace(/[,\s]/g,"");if(!/^\d*\.?\d*$/.test(t)||t===""||t===".")return NaN;return parseFloat(t)};

/* ---------- storage ---------- */
const KEY="setaside.v1";
let storageOK=true;
const defaults=()=>({v:2,rate:25,lastTax:null,big:false,seen:false,unlocked:false,
  rates:[{from:"2024-01-01",c:67},{from:"2025-01-01",c:70},{from:"2026-01-01",c:72.5},{from:"2026-07-01",c:76}],
  income:[],expenses:[],trips:[],payments:[],jars:[]});
function load(){
  if(IS_DEMO)return null;
  let raw=null;
  try{raw=localStorage.getItem(KEY)}catch(e){storageOK=false}
  if(raw){try{const d=JSON.parse(raw);if(d&&(d.v===1||d.v===2))return normalize(d)}catch(e){}}
  return null;
}
function normalize(d){
  const b=defaults();
  ["income","expenses","trips","payments","rates","jars"].forEach(k=>{if(!Array.isArray(d[k]))d[k]=b[k]});
  if(typeof d.rate!=="number"||!(d.rate>=0&&d.rate<=100))d.rate=25;
  if(typeof d.lastTax!=="number"||!(d.lastTax>=0))d.lastTax=null;
  d.big=!!d.big;d.unlocked=!!d.unlocked;
  d.jars=d.jars.filter(j=>j&&typeof j.id==="string"&&typeof j.name==="string"&&j.goal>0&&Array.isArray(j.entries)).map(j=>{j.color=(j.color>=0&&j.color<6)?j.color|0:0;j.due=/^\d{4}-\d{2}-\d{2}$/.test(j.due||"")?j.due:null;return j});
  d.seen=!!d.seen||[d.income,d.expenses,d.trips,d.payments,d.jars].some(a=>a.length>0);
  d.v=2;return d;
}
function save(){if(IS_DEMO)return;try{localStorage.setItem(KEY,JSON.stringify(S));storageOK=true}catch(e){storageOK=false}}
let S=load();
let firstRun=false;
if(!S){S=defaults();firstRun=true}

/* ---------- tax logic ---------- */
const CATS=[
  {id:"supplies",name:"Supplies and materials",f:1},
  {id:"software",name:"Software and subscriptions",f:1},
  {id:"phone",name:"Phone and internet",f:1},
  {id:"fees",name:"Fees (payment, platform)",f:1},
  {id:"ads",name:"Advertising",f:1},
  {id:"equip",name:"Equipment and tools",f:1},
  {id:"edu",name:"Training and education",f:1},
  {id:"meals",name:"Work meals",f:0.5},
  {id:"other",name:"Other",f:1}
];
const CATCOL={supplies:"var(--c1)",software:"var(--c2)",phone:"var(--c3)",fees:"var(--c4)",ads:"var(--c5)",equip:"var(--c6)",edu:"var(--c7)",meals:"var(--c8)",other:"var(--c9)"};
const cat=id=>CATS.find(c=>c.id===id)||CATS[CATS.length-1];
const expDeduct=e=>Math.round(e.amount*cat(e.cat).f);
const ratesSorted=()=>S.rates.slice().sort((a,b)=>a.from<b.from?-1:a.from>b.from?1:0);
const rateFor=date=>{const r=ratesSorted();let pick=r[0];r.forEach(x=>{if(x.from<=date)pick=x});return pick};
const tripMiles=t=>t.miles*(t.rt?2:1);
const tripDeduct=t=>Math.round(tripMiles(t)*rateFor(t.date).c);

/* due dates: next business day when the 15th lands on a weekend or legal holiday */
function nthMonday(y,m,n){const d=new Date(y,m,1);while(d.getDay()!==1)d.setDate(d.getDate()+1);d.setDate(d.getDate()+7*(n-1));return d}
function isHoliday(d){
  const y=d.getFullYear(),m=d.getMonth(),day=d.getDate();
  if(m===0){if(nthMonday(y,0,3).getDate()===day)return true}
  if(m===3){const w=new Date(y,3,16).getDay();let od=16;if(w===6)od=15;if(w===0)od=17;if(day===od)return true}
  return false;
}
function dueDate(y,m,d){const dt=new Date(y,m-1,d);while(dt.getDay()===0||dt.getDay()===6||isHoliday(dt))dt.setDate(dt.getDate()+1);return iso(dt)}
const quarters=y=>[
  {k:1,span:"Jan–Mar",end:y+"-03-31",due:dueDate(y,4,15)},
  {k:2,span:"Apr–May",end:y+"-05-31",due:dueDate(y,6,15)},
  {k:3,span:"Jun–Aug",end:y+"-08-31",due:dueDate(y,9,15)},
  {k:4,span:"Sep–Dec",end:y+"-12-31",due:dueDate(y+1,1,15)}
];
const returnDue=y=>dueDate(y+1,4,15);

function totals(y,endDate){
  const ys=String(y),end=endDate||(y+"-12-31");
  let inc=0,exp=0,mil=0,miles=0;
  S.income.forEach(a=>{if(a.date.slice(0,4)===ys&&a.date<=end)inc+=a.amount});
  S.expenses.forEach(b=>{if(b.date.slice(0,4)===ys&&b.date<=end)exp+=expDeduct(b)});
  S.trips.forEach(t=>{if(t.date.slice(0,4)===ys&&t.date<=end){mil+=tripDeduct(t);miles+=tripMiles(t)}});
  const costs=exp+mil,profit=inc-costs,sa=Math.max(0,Math.round(profit*S.rate/100));
  return {inc,exp,mil,miles,costs,profit,sa,keep:profit-sa};
}
const TOL=1000; /* less than $10 short still counts as covered */
const paidBy=(y,date)=>S.payments.reduce((s,p)=>s+(p.ty===y&&p.date<=date?p.amount:0),0);
const paidAll=y=>paidBy(y,"9999-12-31");
const paidWin=(y,a,b)=>S.payments.reduce((s,p)=>s+(p.ty===y&&p.date>a&&p.date<=b?p.amount:0),0);

/* Where does this tax year stand? Date-based: a payment counts toward every date on or after it. */
function jarState(y){
  const T=totals(y),today=todayStr(),Q=quarters(y),paid=paidAll(y);
  const rows=[];let nq=null,behind=0,prevDue="0000-00-00";
  Q.forEach(q=>{
    const need=totals(y,q.end).sa,pDue=paidBy(y,q.due);
    const row={q,need,win:paidWin(y,prevDue,q.due),st:"up",short:0};
    if(q.due<today){
      if(need<TOL&&pDue===0)row.st="none";
      else if(pDue>=need-TOL)row.st="paid";
      else if(paid>=need-TOL)row.st="late";
      else{row.st="behind";row.short=need-paid;behind=Math.max(behind,row.short)}
    }else if(!nq){nq=q;row.st="next"}
    prevDue=q.due;rows.push(row);
  });
  let streak=0;
  for(let i=rows.length-1;i>=0;i--){const r=rows[i];if(r.q.due>=today)continue;if(r.st==="paid")streak++;else if(r.st==="none")continue;else break}
  const target=nq?totals(y,nq.end).sa:T.sa;
  const owed=Math.max(0,target-paid);
  const empty=!T.inc&&!T.costs;
  let state="track";
  if(empty)state="empty";else if(behind>=TOL)state="behind";else if(owed<TOL)state="covered";
  const fill=target>0?(state==="covered"?1:Math.max(0,Math.min(1,paid/target))):0;
  return {T,rows,nq,paid,target,owed,behind,streak,state,fill,empty};
}
/* Plan my payment: the amounts behind the slider */
function planFor(y){
  const st=jarState(y),k=st.nq?st.nq.k:4;
  const need=st.target,paid=st.paid;
  const m90=Math.round(need*0.9);
  let mLast=null;
  if(S.lastTax!=null)mLast=Math.round(S.lastTax*(S.big?1.1:1)*k/4);
  const safeCum=mLast==null?m90:Math.min(m90,mLast);
  const full=Math.max(0,need-paid);
  const min=Math.min(full,Math.max(0,safeCum-paid));
  const catchup=Math.min(full,st.behind>=TOL?st.behind:0);
  return {st,need,paid,full,min,catchup,m90,mLast,k,usedLast:mLast!=null&&mLast<m90};
}

/* best week: this week against a usual week */
const weekStart=s=>{const d=parseISO(s);d.setDate(d.getDate()-((d.getDay()+6)%7));return iso(d)};
function bestWeek(y){
  if(y!==curYear)return null;
  const tot={};S.income.forEach(e=>{if(e.date.slice(0,4)===String(y)){const w=weekStart(e.date);tot[w]=(tot[w]||0)+e.amount}});
  const cur=weekStart(todayStr()),c=tot[cur]||0;
  const prev=Object.keys(tot).filter(k=>k<cur);
  const first=S.income.filter(e=>e.date.slice(0,4)===String(y)).map(e=>e.date).sort()[0];
  if(!first)return null;
  const weeks=Math.max(1,Math.round(daysBetween(weekStart(first),cur)/7));
  if(weeks<4)return null;
  const sum=prev.reduce((s,k)=>s+tot[k],0),avg=sum/weeks;
  const mx=prev.reduce((m,k)=>Math.max(m,tot[k]),0);
  if(c<10000||c<avg*1.5)return null;
  return {cur:c,avg:Math.round(avg),best:c>mx};
}

/* ---------- unlock code check (tiny SHA-256, works on any page) ---------- */
function sha256(ascii){
  function rr(v,a){return (v>>>a)|(v<<(32-a))}
  const mp=Math.pow,mw=mp(2,32);let result="",i,j;
  const words=[],bits=ascii.length*8;let hash=[];const k=[];let pc=0;const comp={};
  for(let c=2;pc<64;c++){
    if(!comp[c]){for(i=0;i<313;i+=c)comp[i]=c;hash[pc]=(mp(c,.5)*mw)|0;k[pc++]=(mp(c,1/3)*mw)|0}
  }
  ascii+="\x80";while(ascii.length%64-56)ascii+="\x00";
  for(i=0;i<ascii.length;i++){j=ascii.charCodeAt(i);if(j>>8)return "";words[i>>2]|=j<<((3-i)%4)*8}
  words[words.length]=((bits/mw)|0);words[words.length]=bits;
  for(j=0;j<words.length;){
    const w=words.slice(j,j+=16),old=hash;hash=hash.slice(0,8);
    for(i=0;i<64;i++){
      const w15=w[i-15],w2=w[i-2],a=hash[0],e=hash[4];
      const t1=hash[7]+(rr(e,6)^rr(e,11)^rr(e,25))+((e&hash[5])^((~e)&hash[6]))+k[i]+(w[i]=(i<16)?w[i]:(w[i-16]+(rr(w15,7)^rr(w15,18)^(w15>>>3))+w[i-7]+(rr(w2,17)^rr(w2,19)^(w2>>>10)))|0);
      const t2=(rr(a,2)^rr(a,13)^rr(a,22))+((a&hash[1])^(a&hash[2])^(hash[1]&hash[2]));
      hash=[(t1+t2)|0].concat(hash);hash[4]=(hash[4]+t1)|0;
    }
    for(i=0;i<8;i++)hash[i]=(hash[i]+old[i])|0;
  }
  for(i=0;i<8;i++)for(j=3;j+1;j--){const b=(hash[i]>>(j*8))&255;result+=((b<16)?0:"")+b.toString(16)}
  return result;
}
const normCode=s=>String(s||"").toUpperCase().replace(/[^A-Z0-9]/g,"");
const codeOK=s=>{const n=normCode(s);return n.length>=6&&CODES.indexOf(sha256("setaside:"+n))>=0};

/* motion that runs after the HTML is in place */
function countUp(el){
  const to=+el.getAttribute("data-to"),key=el.getAttribute("data-key")||"",kind=el.getAttribute("data-cu");
  const prev=ui.last["cu:"+key],from=prev!=null?prev:0;ui.last["cu:"+key]=to;
  const set=v=>{if(kind==="big")el.innerHTML=bigMoney(v);else el.textContent=money0(v)};
  if(REDUCED||from===to){set(to);return}
  const t0=performance.now(),dur=950;set(from);
  const step=t=>{const p=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-p,3);set(Math.round(from+(to-from)*e));if(p<1)requestAnimationFrame(step)};
  requestAnimationFrame(step);
}
function afterRender(){
  const root=$("#main");
  void root.offsetHeight;
  $$(".liq",root).forEach(g=>{g.style.transform="translateY("+g.getAttribute("data-y")+"px)"});
  $$(".rseg",root).forEach(c=>{c.style.strokeDasharray=c.getAttribute("data-d")});
  $$("[data-cu]",root).forEach(countUp);
}

function planPresets(P){
  const out=[{id:"full",v:P.full,t:"Cover it all"}];
  if(P.min>=TOL&&P.min<P.full-TOL)out.push({id:"min",v:P.min,t:"Safe minimum"});
  if(P.st.behind>=TOL&&P.catchup>=TOL&&Math.abs(P.catchup-P.min)>100&&Math.abs(P.catchup-P.full)>100&&P.catchup<P.full)out.push({id:"catch",v:P.catchup,t:"Catch up"});
  out.push({id:"mine",v:null,t:"Pick amount"});
  return out;
}
function planMsg(P,x){
  const due=planDue(),left=Math.max(0,P.full-x);
  if(x>=P.full-TOL)return {cls:"ok",h:`<b>Pay ${money(x)} by ${due}</b> and your tax jar is full. You're covered through ${due}.`};
  if(P.min<TOL||x>=P.min-TOL)return {cls:"ok",h:`<b>Pay ${money(x)} by ${due}</b> and you're penalty-safe.${P.min<TOL?" You're already there, so any payment is a bonus.":""}<br><b>${money0(left)}</b> stays with you for now. It's still part of your tax, so you'd settle it on a later date or when you file.`};
  return {cls:"warn",h:`<b>${money(x)} is ${money0(P.min-x)} short of the safe line.</b> The IRS may charge a small penalty for the days you're short. Pay at least <b>${money(P.min)}</b> by ${due} to avoid it.`};
}

  planP=planFor(ui.year);const P=planP;if(P.full<TOL||!$("#planRange"))return;
  const presets=planPresets(P);
  if(reset||!presets.some(p=>p.id===planSel))planSel=(presets.some(p=>p.id==="min")?"min":"full");
  const cur=presets.find(p=>p.id===planSel);
  if(cur&&cur.v!=null)planVal=cur.v;
  planVal=Math.max(0,Math.min(P.full,planVal));
  const r=$("#planRange");r.max=P.full;r.value=planVal;planPaint();
}
function planPaint(){
  const P=planP,x=planVal,r=$("#planRange");if(!r)return;
  const mf=P.min<TOL?0:Math.min(1,P.min/P.full);
  r.style.setProperty("--mp",(mf*100).toFixed(2)+"%");
  $("#planAmt").textContent=money(x);
  const gz=$("#gauge");gz.classList.toggle("nomin",mf<=0.001);
  $("#gzPen").style.display=mf>0.2?"":"none";$("#gzSafe").style.display=mf<.8?"":"none";
  const lm=$("#gzMin"),tight=mf<0.16||mf>0.7;
  lm.firstChild.textContent=money0(P.min);lm.style.left="clamp(34px,"+(mf*100).toFixed(2)+"%,calc(100% - 34px))";lm.style.display=(mf>0.001&&mf<.98)?"":"none";
  $(".gz-lab",gz).classList.toggle("tight",tight&&mf>0.001&&mf<.98);
  $(".l1 b",gz).textContent=money0(P.full);
  const presets=planPresets(P);
  const sel=presets.find(p=>p.v!=null&&Math.abs(p.v-x)<100);
  planSel=sel?sel.id:"mine";
  $("#planSeg").innerHTML=presets.map(p=>`<button type="button" data-act="plan-pick" data-id="${p.id}" class="${p.id===planSel?"on":""}" aria-pressed="${p.id===planSel}"><b>${p.v!=null?money0(p.v):"Mine"}</b><span>${p.t}</span></button>`).join("");
  const m=planMsg(P,x),pm=$("#planMsg");pm.className="prev "+m.cls;pm.innerHTML=m.h+(P.usedLast?"<br><small>Safe minimum uses last year's tax, which is lower.</small>":"");
  const st=P.st;
  $("#planCatch").innerHTML=st.behind>=TOL?`<div class="prev warn" style="margin-top:10px"><b>Catch up:</b> you're ${money0(st.behind)} behind on an earlier date. Pay it now and the penalty stops growing. A small penalty for the late days may still show up when you file.</div>`:"";
  const lh=$("#lastHint");if(lh)lh.textContent=P.mLast==null?"Add it and I'll check if last year's number gives you a lower safe amount.":(P.usedLast?"Nice. Last year's number gives you a lower safe amount.":"Last year's number doesn't beat the 90% line this time, so the 90% line stays.");
}
function onPlanSlide(v){
  const P=planP;v=Math.round(+v);
  const snaps=[P.full];if(P.min>=TOL)snaps.push(P.min);if(P.st.behind>=TOL&&P.catchup>=TOL)snaps.push(P.catchup);
  let hit=null;snaps.forEach(s=>{if(Math.abs(v-s)<=250)hit=s});
  if(hit!=null)v=hit;else v=Math.round(v/100)*100;
  v=Math.max(0,Math.min(P.full,v));
  planVal=v;$("#planRange").value=v;planPaint();
}

const CONF=["#2BBF8A","#7BA9FF","#F2B056","#E87BA4","#8E7DFF","#FFD84D"];
function confetti(n){
  const host=$("#confetti");host.innerHTML="";if(REDUCED)return;
  const vw=window.innerWidth,vh=window.innerHeight;let h="";
  for(let i=0;i<n;i++){

    const dx=Math.cos(ang)*sp*1.35,dy=Math.sin(ang)*sp,rot=(Math.random()-.5)*900,dly=Math.random()*140,sh=i%4===0?"50%":"2px";
    h+=`<i style="left:${(vw/2).toFixed(0)}px;top:${(vh*0.58).toFixed(0)}px;width:${sz.toFixed(1)}px;height:${(sz*(i%3?1.8:1)).toFixed(1)}px;background:${CONF[i%6]};border-radius:${sh};--dx:${dx.toFixed(0)};--dy:${dy.toFixed(0)};--r:${rot.toFixed(0)};animation-delay:${dly.toFixed(0)}ms"></i>`;

function celebratePayment(amt){

function celebrateJar(j,before,after){

/* ---------- save + delete + undo ---------- */
function dateOK(d){return /^\d{4}-\d{2}-\d{2}$/.test(d)&&!isNaN(parseISO(d).getTime())&&+d.slice(0,4)>=2000&&+d.slice(0,4)<=2100}
function afterSave(date,msg){const y=+date.slice(0,4);if(y!==ui.year)ui.year=y;save();closeSheet();render();toast(msg)}
function submitForm(){
  const st=ui.sheetType,ed=editing,id=ed?ed.id:null;
  if(st==="mrate"){
    const from=$("#fFrom").value,c=parseNum($("#fCents").value);
    if(!dateOK(from))return setErr("Pick the date this rate starts.");
    if(isNaN(c)||c<=0||c>300)return setErr("Enter the rate in cents per mile, like 76.");
    if(editingRate){editingRate.from=from;editingRate.c=c}else{S.rates=S.rates.filter(r=>r.from!==from);S.rates.push({from,c})}
    save();closeSheet();render();toast("Rate saved");return;
  }
  if(st==="jar"){
    const name=$("#fJName").value.trim(),g=parseMoney($("#fGoal").value),d=$("#fJDate").value;
    if(!name)return setErr("Give the jar a name.");
    if(isNaN(g)||g<=0)return setErr("Enter a goal amount, like 1000.");
    if(d&&!dateOK(d))return setErr("That goal date doesn't look right.");
    let j=id?findJar(id):null;
    if(j){j.name=name;j.goal=g;j.due=d||null;j.color=jarColor;delete j.s;save();closeSheet();render();toast("Jar updated");return}
    if(IS_DEMO&&S.jars.length>=DEMO_JARS){closeSheet();return sheetLocked("jars")}
    j={id:uid(),name,goal:g,due:d||null,color:jarColor,entries:[]};S.jars.push(j);ui.jar=j.id;ui.tab="home";
    save();closeSheet();render();window.scrollTo(0,0);toast("Jar made. Now fill it.");return;
  }
  if(st==="jarmoney"){
    const j=findJar(jarCtx.id),a=parseMoney($("#fAmt").value),date=$("#fDate").value;
    if(!j)return closeSheet();
    if(isNaN(a)||a<=0)return setErr("Enter an amount greater than zero.");
    if(!dateOK(date))return setErr("Pick a date.");
    if(jarCtx.dir<0&&a>Math.max(0,jarSaved(j)))return setErr("You only have "+money(Math.max(0,jarSaved(j)))+" in this jar.");
    const before=jarPct(j);
    j.entries.push({id:uid(),date,amt:jarCtx.dir*a,note:$("#fNote").value.trim()});delete j.s;
    const after=jarPct(j);save();closeSheet();render();
    if(jarCtx.dir>0&&celebrateJar(j,before,after))return;
    toast(jarCtx.dir>0?"Added. The jar is a little fuller.":"Taken out");return;
  }
  if(st==="jarentry"){
    const j=findJar(ed.jid),e=j&&find(j.entries,id),a=parseMoney($("#fAmt").value),date=$("#fDate").value;
    if(!e)return closeSheet();
    if(isNaN(a)||a<=0)return setErr("Enter an amount greater than zero.");
    if(!dateOK(date))return setErr("Pick a date.");
    e.amt=entryDir*a;e.date=date;e.note=$("#fNote").value.trim();save();closeSheet();render();toast("Entry updated");return;
  }
  const date=$("#fDate").value;
  if(!dateOK(date))return setErr("Pick a date.");
  if(st==="income"){
    const a=parseMoney($("#fAmt").value);if(isNaN(a)||a<=0)return setErr("Enter an amount greater than zero, like 125.50.");
    const t=marginalTax(date,a,id);
    const rec=id?find(S.income,id):{id:uid()};rec.date=date;rec.amount=a;rec.source=$("#fSrc").value.trim();rec.note=$("#fNote").value.trim();delete rec.s;if(!id)S.income.push(rec);
    afterSave(date,id?"Payday updated":"Added. "+money0(t)+" went in your tax jar.");
  }else if(st==="expense"){
    const a=parseMoney($("#fAmt").value);if(isNaN(a)||a<=0)return setErr("Enter an amount greater than zero, like 24.99.");
    const r=id?find(S.expenses,id):{id:uid()};r.date=date;r.amount=a;r.cat=$("#fCat").value;r.desc=$("#fDesc").value.trim();delete r.s;if(!id)S.expenses.push(r);
    afterSave(date,id?"Work cost updated":"Added. That lowers your tax.");
  }else if(st==="trip"){
    const m=parseNum($("#fMiles").value);if(isNaN(m)||m<=0||m>2000)return setErr("Enter the miles driven, like 12.4.");
    const r=id?find(S.trips,id):{id:uid()};r.date=date;r.miles=Math.round(m*10)/10;r.rt=$("#fRt").checked;r.purpose=$("#fPur").value.trim();delete r.s;if(!id)S.trips.push(r);
    afterSave(date,id?"Trip updated":"Trip added");
  }else if(st==="payment"){
    const a=parseMoney($("#fAmt").value);if(isNaN(a)||a<=0)return setErr("Enter the amount you paid, like 1200.");
    const r=id?find(S.payments,id):{id:uid(),ty:ui.year};r.date=date;r.amount=a;delete r.s;delete r.q;if(!id)S.payments.push(r);
    save();closeSheet();render();
    if(id)toast("Payment updated");else celebratePayment(a);
  }
}

/* ---------- export / backup ---------- */
function csvCell(v){
  if(typeof v==="number")return String(v);
  let s=String(v==null?"":v);
  if(/^[=+\-@\t\r]/.test(s))s="'"+s;
  return /[",\n\r]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;
}
function csvFor(y){
  const ys=String(y),list=[];
  const rows=[["Date","Type","Description","Category","Amount","Miles","Rate (cents per mile)","Counts as cost","Note"]];
  S.income.forEach(e=>{if(e.date.slice(0,4)===ys)list.push([e.date,"Money in",e.source||"","",(e.amount/100).toFixed(2),"","","",e.note||""])});
  S.expenses.forEach(e=>{if(e.date.slice(0,4)===ys)list.push([e.date,"Work cost",e.desc||"",cat(e.cat).name,(e.amount/100).toFixed(2),"","",(expDeduct(e)/100).toFixed(2),cat(e.cat).f!==1?"50% counts":""])});
  S.trips.forEach(e=>{if(e.date.slice(0,4)===ys)list.push([e.date,"Mileage",e.purpose||"","","",tripMiles(e),rateFor(e.date).c,(tripDeduct(e)/100).toFixed(2),e.rt?"Round trip":""])});
  S.payments.forEach(e=>{if(e.ty===y)list.push([e.date,"Tax payment","Estimated tax payment","",(e.amount/100).toFixed(2),"","","",""])});
  list.sort((a,b)=>a[0]<b[0]?-1:a[0]>b[0]?1:0);
  const T=totals(y);
  list.forEach(r=>rows.push(r));
  rows.push([]);rows.push(["Summary "+y,"","","","","","","",""]);
  rows.push(["","Money in","","",(T.inc/100).toFixed(2),"","","",""]);
  rows.push(["","Work costs (costs + mileage)","","",(T.costs/100).toFixed(2),"","","",""]);
  rows.push(["","Profit","","",(T.profit/100).toFixed(2),"","","",""]);
  rows.push(["","Tax jar at "+S.rate+"%","","",(T.sa/100).toFixed(2),"","","",""]);
  rows.push(["","Yours to spend","","",(T.keep/100).toFixed(2),"","","",""]);
  return rows.map(r=>r.map(csvCell).join(",")).join("\r\n")+"\r\n";
}
function saveFile(name,text,mime){
  const fallback=()=>{try{const blob=new Blob([text],{type:mime});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);toast("Saved "+name)}catch(e){showText("Copy this text",text)}};
  if(window.claude&&typeof window.claude.use==="function"){
    window.claude.use("downloads").then(d=>{
      if(!d){fallback();return}
      d.save({filename:name,data:text}).then(()=>toast("Saved "+name)).catch(e=>{if(e&&e.code==="declined")return;showText("Copy this text",text)});
    }).catch(fallback);
  }else fallback();
}
function showText(title,text){
  ui.sheetType="text";
  openSheet(title,'<p class="hint">Select all and copy. Paste it into a spreadsheet or a note.</p><textarea class="inp" id="txtOut" readonly></textarea><div class="btnrow"><button type="button" class="btn primary" data-act="txt-copy">Copy</button><button type="button" class="btn" data-act="close">Close</button></div>',"txtOut");
  $("#txtOut").value=text;
}
function copyText(text){
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(text).then(()=>toast("Copied")).catch(()=>showText("Copy this text",text));
  else showText("Copy this text",text);
}
let pendingRestore=null;
function restoreFromFile(file){
  const fr=new FileReader();
  fr.onload=()=>{
    let d;try{d=JSON.parse(fr.result)}catch(e){toast("That file is not a Set Aside backup");return}
    if(!d||(d.v!==1&&d.v!==2)||!Array.isArray(d.income)||!Array.isArray(d.expenses)||!Array.isArray(d.trips)){toast("That file is not a Set Aside backup");return}
    pendingRestore=normalize(d);ui.sheetType="restore";
    openSheet("Restore this backup?",`<p style="margin:0 0 14px">This replaces everything on this device with the backup: ${pendingRestore.income.length} paydays, ${pendingRestore.expenses.length} work costs, ${pendingRestore.trips.length} trips, ${pendingRestore.payments.length} payments and ${pendingRestore.jars.length} jars.</p><div class="btnrow"><button type="button" class="btn primary" data-act="restore-go">Replace my data</button><button type="button" class="btn" data-act="close">Cancel</button></div>`);
  };
  fr.readAsText(file);
}
